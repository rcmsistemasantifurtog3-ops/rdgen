name: EcoZap - testes e instalador

on:
  push:
    paths:
      - "ecozap/**"
      - ".github/workflows/ecozap.yml"
  pull_request:
    paths:
      - "ecozap/**"
      - ".github/workflows/ecozap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ecozap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecozap/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Rodar testes
        run: python -m pytest -q

  instalador:
    name: Gerar instalador Windows
    needs: testes
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ecozap
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecozap/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller

      - name: Gerar ícone
        run: python -c "from ecozap import icone; icone.salvar_ico('instalador/ecozap.ico')"

      - name: Gerar executáveis (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build instalador/ecozap.spec

      - name: Testar o executável gerado
        run: |
          $cli = "dist\EcoZap\ecozap-cli.exe"
          & $cli --versao
          $tmp = Join-Path $env:RUNNER_TEMP "ecozap-teste"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          @{ pasta_dados = "$tmp\dados"; pasta_entrada = "$tmp\entrada"; numero_loja = "11933334444" } | ConvertTo-Json |
            Set-Content -Encoding utf8 "$tmp\config.json"
          "TOTAL R`$ 10,00`nCel: (11) 98765-4321`n[[QR:https://www.nfce.fazenda.sp.gov.br/qrcode?p=1]]`n" |
            Set-Content -Encoding utf8 "$tmp\cupom.txt"
          # texto -> PDF com QR -> JPEG (testa fpdf2, qrcode, pdfium e Pillow empacotados)
          & $cli --config "$tmp\config.json" enviar "$tmp\cupom.txt" --formato jpeg
          if ($LASTEXITCODE -ne 0) { throw "falha ao enviar texto" }
          # PDF -> leitura do QR com zxing-cpp empacotado
          $pdf = Get-ChildItem "$tmp\dados\comprovantes" -Recurse -Filter *.pdf | Select-Object -First 1
          & $cli --config "$tmp\config.json" enviar $pdf.FullName 11987654321
          if ($LASTEXITCODE -ne 0) { throw "falha ao enviar PDF" }
          & $cli --config "$tmp\config.json" relatorio --saida "$tmp\rel"
          if ($LASTEXITCODE -ne 0) { throw "falha no relatório" }
          & $cli --config "$tmp\config.json" promocao autorizar 11987654321
          & $cli --config "$tmp\config.json" promocao criar --titulo Teste --texto "Oferta teste"
          if ($LASTEXITCODE -ne 0) { throw "falha ao criar promoção" }
          & $cli --config "$tmp\config.json" cartaz --saida "$tmp\cartaz.pdf"
          if ($LASTEXITCODE -ne 0) { throw "falha no cartaz" }
          Get-ChildItem "$tmp\dados\simulado"

      - name: Gerar instalador (Inno Setup)
        run: |
          $versao = python -c "import ecozap; print(ecozap.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$versao" instalador\ecozap.iss
          if ($LASTEXITCODE -ne 0) { throw "falha no Inno Setup" }

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: EcoZap-Instalador
          path: ecozap/dist/EcoZap-Instalador-*.exe
          retention-days: 30
